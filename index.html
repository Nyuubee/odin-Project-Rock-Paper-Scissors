<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="header">Ron's Jajanken</div>
    <div class="game-container">
        <div class="enemy-container">
            <button id="enemy-rock"><img src="images/rock.png" alt="Rock"></button>
            <button id="enemy-paper"><img src="images/paper.png" alt="Paper"></button>
            <button id="enemy-scissors"><img src="images/scissors.png" alt="Scissors"></button>
        </div>
        <h2>VS</h2>
            <div class="player-container">
                <button id="rock"><img src="images/rock.png" alt="Rock"></button>
                <button id="paper"><img src="images/paper.png" alt="Paper"></button>
                <button id="scissors"><img src="images/scissors.png" alt="Scissors"></button>
            </div>
    </div>

    <div class="result-container">
        <div class="container">
            <div id="win-score">Won: 0</div>
            <div id="lose-score">Lost: 0</div>
            <div id="draw-score">Draw: 0</div>
        </div>

    </div>

    <div class="modal">
        <div class="modal-container">
            <h2>Game Over!</h2>
            <button id="start-over">Play again</button>
        </div>
    </div>

    <script src="javascript.js"></script>
</body>

</html>
